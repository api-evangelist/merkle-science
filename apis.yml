aid: merkle-science
name: Merkle Science
description: >-
  Merkle Science is a blockchain analytics and predictive crypto risk platform that helps
  virtual asset businesses, financial institutions, and government agencies detect fraud,
  monitor transactions, and stay compliant with AML, KYC, and CFT regulations across
  10,000+ crypto assets. Its product suite includes Compass (transaction and wallet
  monitoring), Tracker (forensic investigation and fund tracing), KYBB / Know Your
  Blockchain Business (counterparty due diligence and risk intelligence), Onchain Pulse
  (ecosystem monitoring and token risk scoring), and Institute (compliance training and
  certification). The public KYBB API exposes off-chain VASP due-diligence data —
  KYC/AML posture, supported coins and FIAT, permitted activities, regulatory alerts,
  licensing and legal-entity records, and jurisdictional restrictions. Merkle Science is
  backed by 500 Global.
